{% extends "layouts/base.html" %}
{% block title %}{{ t('diseases.delete_title') }}{% endblock %}

{% block content %}
<div class="card p-4">
    <h4 class="mb-2 text-danger">{{ t('diseases.delete_title') }}</h4>
    <p class="text-muted">{{ t('diseases.delete_confirm', name=disease.name) }}</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">{{ t('rules.confirm_delete_btn') }}</button>
            <a href="{{ url_for('expert_system.diseases_index') }}" class="btn btn-secondary">{{ t('btn.cancel') }}</a>
        </div>
    </form>
</div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - IDNS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Khmer:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Khmer', sans-serif;
            background: linear-gradient(135deg, #f8f9fc 0%, #e8edf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: #1f2937;
        }
        .error-container {
            text-align: center;
            max-width: 480px;
            padding: 2.5rem;
        }
        .error-icon {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 2.25rem;
        }
        .error-icon.forbidden {
            background: #fef2f2;
            color: #dc2626;
        }
        .error-icon.not-found {
            background: #fffbeb;
            color: #d97706;
        }
        .error-icon.server-error {
            background: #f0f4ff;
            color: #4f46e5;
        }
        .error-code {
            font-size: 4rem;
            font-weight: 800;
            color: #d1d5db;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .error-title {
            font-size: 1.375rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #111827;
        }
        .error-message {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .error-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-back {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.15s;
        }
        .btn-back:hover {
            background: #1d4ed8;
            color: #fff;
        }
        .btn-home {
            background: #fff;
            color: #374151;
            border: 1px solid #e5e7eb;
            padding: 0.625rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.15s;
        }
        .btn-home:hover {
            background: #f9fafb;
            border-color: #d1d5db;
            color: #111827;
        }
        .error-footer {
            margin-top: 3rem;
            color: #9ca3af;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon {{ icon_class }}">
            <i class="bi {{ icon }}"></i>
        </div>
        <div class="error-code">{{ error_code }}</div>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        <div class="error-actions">
            <a href="javascript:history.back()" class="btn-back">
                <i class="bi bi-arrow-left"></i> Go Back
            </a>
            <a href="/" class="btn-home">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
        <div class="error-footer">
            IDNS Chicken Diagnosis System
        </div>
    </div>
</body>
</html>
